name: P2 data contract tests
on:
  push:
    branches: [main, p1-foundation, integration/p1-p2-evidence-on-main]
    paths:
      - "P2/**"
      - ".github/workflows/test-p2-data-contracts.yml"
  pull_request:
    branches: [main]
    paths:
      - "P2/**"
      - ".github/workflows/test-p2-data-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-p2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run P2 data contract tests
        run: python -m unittest discover -s P2 -p 'test_*.py' -v
      - name: Rebuild evidence-linked P2 species register
        run: |
          python P2/species/migrate_p1_ecology_parameters.py --ecology-csv P1/species/species_ecology_parameters.csv --evidence-csv P1/species/species_evidence_register.csv --out "$RUNNER_TEMP/species_response_parameters.csv"
          cmp P2/species/species_response_parameters.csv "$RUNNER_TEMP/species_response_parameters.csv"
      - name: Validate P2 species response register
        run: python P2/validate_p2_data.py --species-csv P2/species/species_response_parameters.csv
      - name: Rebuild priority species response evidence-gap matrix
        run: |
          python P2/species/build_species_response_gap_matrix.py --candidates P1/species/species_candidate_register.csv --ecology P1/species/species_ecology_parameters.csv --evidence P1/species/species_evidence_register.csv --literature P2/species/species_response_literature_register.csv --out "$RUNNER_TEMP/species_response_evidence_gaps.csv"
          cmp P2/species/species_response_evidence_gaps.csv "$RUNNER_TEMP/species_response_evidence_gaps.csv"
      - name: Audit environment response rule eligibility
        run: |
          python P2/species/audit_environment_response_rules.py --rules-csv P2/species/environment_response_rules_template.csv --candidates-csv P2/species/species_response_evidence_gaps.csv --out "$RUNNER_TEMP/environment_response_rule_audit.csv"
          python P2/species/audit_environment_response_rules.py --help
      - name: Check validator CLI
        run: python P2/validate_p2_data.py --help
