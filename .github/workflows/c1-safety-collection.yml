name: C1 official safety source collection
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [c1-safety-collector]
    paths:
      - "C1/collector/**"
      - "C1/test_collector.py"
      - ".github/workflows/c1-safety-collection.yml"
permissions:
  contents: read
concurrency:
  group: c1-official-safety-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing collector dependency
        run: python -m pip install --disable-pip-version-check -r P1/collector/requirements.txt
      - name: Validate collector unit tests
        run: python -m unittest discover -s C1 -p 'test_*.py' -v
      - name: Collect official CWA safety sources
        env:
          CWA_AUTHORIZATION: ${{ secrets.CWA_AUTHORIZATION }}
        run: |
          if [ -z "$CWA_AUTHORIZATION" ]; then
            echo "::error::Repository secret CWA_AUTHORIZATION is not configured."
            exit 1
          fi
          python C1/collector/fetch_cwa_safety_sources.py --out output/c1_safety_sources
          python C1/collector/normalize_cwa_safety_sources.py --input output/c1_safety_sources --out output/c1_safety_decisions
      - name: Upload raw official source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-official-safety-sources
          path: |\n            output/c1_safety_sources/\n            output/c1_safety_decisions/
          if-no-files-found: warn
          retention-days: 7
