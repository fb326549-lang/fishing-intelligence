name: C1 official safety source collection
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [c1-safety-collector]
    paths:
      - "C1/collector/**"
      - "C1/test_collector.py"
      - "C1/test_normalize_cwa_safety.py"
      - "C1/test_safety_decision.py"
      - "C1/test_marine_regions.py"
      - "C1/safety_decision.py"
      - ".github/workflows/c1-safety-collection.yml"
permissions:
  contents: write
concurrency:
  group: c1-official-safety-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out persistent tide-history data branch
        uses: actions/checkout@v4
        with:
          ref: tide-history
          path: tide-history-data
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing collector dependency
        run: python -m pip install --disable-pip-version-check -r P1/collector/requirements.txt
      - name: Validate collector unit tests
        run: python -m unittest discover -s C1 -p 'test_*.py' -v
      - name: Collect official CWA safety sources
        env:
          CWA_AUTHORIZATION: ${{ secrets.CWA_AUTHORIZATION }}
        run: |
          if [ -z "$CWA_AUTHORIZATION" ]; then
            echo "::error::Repository secret CWA_AUTHORIZATION is not configured."
            exit 1
          fi
          python C1/collector/fetch_cwa_safety_sources.py --out output/c1_safety_sources
          python C1/collector/normalize_cwa_safety_sources.py --input output/c1_safety_sources --out output/c1_safety_decisions
          python P1/collector/fetch_cwa_marine.py --out output/c1_marine_sources
          python C1/collector/normalize_cwa_marine_regions.py --input output/c1_marine_sources --stations P1/stations/east_region_station_mapping.csv --out output/c1_marine_decisions/latest_marine_conditions.json
      - name: Publish normalized safety decision snapshots
        run: |
          mkdir -p tide-history-data/data
          cp output/c1_safety_decisions/safety_decisions.json tide-history-data/data/latest_safety_decisions.json
          cp output/c1_safety_decisions/source_status.json tide-history-data/data/latest_safety_source_status.json
          cp output/c1_marine_decisions/latest_marine_conditions.json tide-history-data/data/latest_marine_conditions.json
          git -C tide-history-data config user.name "github-actions[bot]"
          git -C tide-history-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tide-history-data add data/latest_safety_decisions.json data/latest_safety_source_status.json data/latest_marine_conditions.json
          if git -C tide-history-data diff --cached --quiet; then
            echo "No change in normalized safety decision snapshots."
          else
            git -C tide-history-data commit -m "Publish latest six-region safety and marine observations"
            git -C tide-history-data push origin HEAD:tide-history
          fi
      - name: Upload raw official source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-official-safety-sources
          path: |
            output/c1_safety_sources/
            output/c1_safety_decisions/
            output/c1_marine_sources/
            output/c1_marine_decisions/
          if-no-files-found: warn
          retention-days: 7
