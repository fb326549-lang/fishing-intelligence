name: CWA station inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-stations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out P1 branch
        uses: actions/checkout@v4
        with:
          ref: p1-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch CWA station metadata
        env:
          CWA_AUTHORIZATION: ${{ secrets.CWA_AUTHORIZATION }}
        run: |
          if [ -z "$CWA_AUTHORIZATION" ]; then
            echo "::error::Repository secret CWA_AUTHORIZATION is not configured."
            exit 1
          fi
          python P1/collector/fetch_cwa_stations.py --out output/cwa_stations

      - name: Upload private-run results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwa-station-inventory
          path: output/cwa_stations/
          if-no-files-found: warn
          retention-days: 3
