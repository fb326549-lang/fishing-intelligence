name: Test marine pipeline

on:
  push:
    branches:
      - p1-foundation
    paths:
      - "P1/collector/**"
      - ".github/workflows/test-marine-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p1-foundation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline marine pipeline regression tests
        run: python -m unittest discover -s P1/collector -p "test_*.py" -v
