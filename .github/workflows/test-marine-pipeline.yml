name: Test marine pipeline

on:
  push:
    branches:
      - main
      - p1-foundation
      - integration/p1-p2-evidence-on-main
    paths:
      - "P1/collector/**"
      - "P1/species/**"
      - "P2/species/**"
      - "index.html"
      - ".github/workflows/test-marine-pipeline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "P1/collector/**"
      - "P1/species/**"
      - "P2/species/**"
      - "index.html"
      - ".github/workflows/test-marine-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install marine collector dependencies
        run: python -m pip install --disable-pip-version-check -r P1/collector/requirements.txt
      - name: Run offline marine pipeline regression tests
        run: python -m unittest discover -s P1/collector -p "test_*.py" -v
      - name: Run offline P2 fish outlook regression tests
        run: python -m unittest discover -s P2/species -p "test_*.py" -v
      - name: Validate PWA inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts or not scripts[-1].strip():
              raise SystemExit("No inline PWA JavaScript block found.")
          Path("/tmp/fishing-intelligence-pwa.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/fishing-intelligence-pwa.js
