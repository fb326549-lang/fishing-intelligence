name: Open-Meteo marine forecast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches:
      - p1-foundation
    paths:
      - 'P1/collector/**'
      - 'P1/species/**'
      - 'P2/**'
      - '.github/workflows/open-meteo-marine-forecast.yml'

concurrency:
  group: p2-hourly-history-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out P1 branch
        uses: actions/checkout@v4
        with:
          ref: p1-foundation

      - name: Check out CWA append-only observation history
        uses: actions/checkout@v4
        with:
          ref: tide-history
          path: tide-history-data

      - name: Check out P2 append-only history branch
        uses: actions/checkout@v4
        with:
          ref: p2-history
          path: p2-history-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r P1/collector/requirements.txt

      - name: Fetch and map CWA high/low tide forecast events
        env:
          CWA_AUTHORIZATION: ${{ secrets.CWA_AUTHORIZATION }}
        run: |
          python P1/collector/fetch_cwa_tide_forecast.py --out output/cwa_tides
          python P1/collector/build_cwa_regional_tide_forecast.py --input output/cwa_tides/F-A0021-001.csv --mapping P1/stations/cwa_tide_region_mapping.csv --out output/cwa_tides/regional_tide_forecast.csv

      - name: Fetch Open-Meteo forecasts for six East Taiwan regions
        run: |
          python P1/collector/collect_open_meteo.py --config P1/collector/config.example.json --out output/open_meteo --delay 1
          latest_dir=$(find output/open_meteo -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          test -n "$latest_dir"
          python P1/collector/summarize_forecast_horizons.py --input "$latest_dir/environmental_forecast.csv" --out "$latest_dir/forecast_horizons_6_12_24.csv"
          python P1/collector/build_regional_forecast_conditions.py --input "$latest_dir/forecast_horizons_6_12_24.csv" --out "$latest_dir/regional_forecast_conditions_6_12_24.csv"
          python P1/collector/validate_forecast_output.py --directory "$latest_dir" --out "$latest_dir/forecast_validation.json"
          python P1/species/build_species_environment_context.py --species-dir P1/species --regional-forecast "$latest_dir/regional_forecast_conditions_6_12_24.csv" --out "$latest_dir/species_environment_context.csv"
          python P2/collector/build_hourly_environment_records.py --forecast-csv "$latest_dir/environmental_forecast.csv" --forecast-dir "$latest_dir" --cwa-observations-jsonl tide-history-data/data/regional_marine_observations_48h.jsonl --cwa-tide-forecast-csv output/cwa_tides/regional_tide_forecast.csv --out "$latest_dir/hourly_environment_p2.jsonl"
          python P2/validate_p2_data.py --environment-jsonl "$latest_dir/hourly_environment_p2.jsonl"
 
      - name: Build P2.4.6 live six-region fish outlook
        run: |
          latest_dir=$(find output/open_meteo -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          test -n "$latest_dir"
          python P2/species/validate_activity_evidence.py --activity-csv P2/species/species_activity_evidence_register.csv --candidates-csv P1/species/species_candidate_register.csv --literature-csv P2/species/species_response_literature_register.csv
          python P2/species/validate_seasonal_activity.py --seasonal-csv P2/species/species_seasonal_activity_register.csv --candidates-csv P1/species/species_candidate_register.csv --literature-csv P2/species/species_response_literature_register.csv
          python P2/species/environment_match_engine.py --environment-jsonl "$latest_dir/hourly_environment_p2.jsonl" --candidates-csv P2/species/species_response_evidence_gaps.csv --rules-csv P2/species/environment_response_rules_template.csv --out "$latest_dir/environment_match.csv"
          python P2/species/integrate_environment_and_activity.py --environment-jsonl "$latest_dir/hourly_environment_p2.jsonl" --candidates-csv P2/species/species_response_evidence_gaps.csv --environment-match-csv "$latest_dir/environment_match.csv" --activity-csv P2/species/species_activity_evidence_register.csv --seasonal-csv P2/species/species_seasonal_activity_register.csv --out "$latest_dir/integrated_hourly_fish_assessment.csv"
          as_of=$(python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo("Asia/Taipei")); h=n.replace(minute=0,second=0,microsecond=0); print((h+timedelta(hours=1) if n!=h else h).isoformat())')
          python P2/species/build_hourly_fish_outlook.py --environment-jsonl "$latest_dir/hourly_environment_p2.jsonl" --candidates-csv P2/species/species_response_evidence_gaps.csv --integrated-csv "$latest_dir/integrated_hourly_fish_assessment.csv" --as-of "$as_of" --out "$latest_dir/hourly_fish_outlook.csv"
          python P2/collector/export_hourly_fish_outlook_json.py --input "$latest_dir/hourly_fish_outlook.csv" --out p2-history-data/data/latest_hourly_fish_outlook.json

      - name: Validate history and commit P2 history plus live outlook
        run: |
          python P2/collector/build_hourly_history_catalog.py --archive-root p2-history-data/data
          python P2/collector/validate_hourly_history.py --archive-root p2-history-data/data
          git -C p2-history-data config user.name "github-actions[bot]"
          git -C p2-history-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C p2-history-data add data/hourly_environment data/latest_hourly_fish_outlook.json
          if git -C p2-history-data diff --cached --quiet; then
            echo "No new hourly records or outlook changes."
          else
            git -C p2-history-data commit -m "Archive P2 hourly environment and publish current fish outlook"
            git -C p2-history-data push origin HEAD:p2-history
          fi

      - name: Upload forecast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-meteo-six-region-forecast
          path: |
            output/open_meteo/
            output/cwa_tides/
          if-no-files-found: warn
          retention-days: 3
